<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axpenproj</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f5f4fb; background: #0c0b16;
  }
  main { padding: 2rem 1.25rem; max-width: 34rem; text-align: center; }
  h1 { font-size: clamp(2rem, 9vw, 3rem); margin: 0; letter-spacing: -.02em; }
  h1 span { color: #f65ada; }
  p.tag { color: #9392af; margin: .4rem 0 2.4rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 1rem; }
  a { color: #47e5ba; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .game { display: block; padding: 1.1rem 1.25rem; border: 1px solid #262437; border-radius: 12px; }
  .game strong { display: block; font-size: 1.25rem; color: #f5f4fb; }
  .game span { color: #9392af; font-size: .92rem; }
  footer { margin-top: 2.5rem; font-size: .85rem; color: #6c6b83; }
</style>
</head>
<body>
<main>
  <h1>AXPEN<span>PROJ</span></h1>
  <p class="tag">small games</p>

  <ul>
    <li>
      <a class="game" href="stackchaos/">
        <strong>Column Chaos</strong>
        <span>hold to smash &middot; let go to bounce</span>
      </a>
    </li>
  </ul>

  <p style="margin-top:2rem"><a href="mailto:axpenproj@gmail.com">axpenproj@gmail.com</a></p>

  <footer>Axpenproj</footer>
</main>
</body>
</html>
